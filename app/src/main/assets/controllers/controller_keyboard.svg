    <g class="key" data-code="Numpad1"><rect class="cap" x="1204" y="256" width="58" height="58" rx="7"/><text class="sh mid" x="1233" y="271">End</text><text class="mn mid" x="1233" y="297">1</text></g>
    <g class="key" data-code="Numpad2"><rect class="cap" x="1268" y="256" width="58" height="58" rx="7"/><text class="sh mid" x="1297" y="271">↓</text><text class="mn mid" x="1297" y="297">2</text></g>
    <g class="key" data-code="Numpad3"><rect class="cap" x="1332" y="256" width="58" height="58" rx="7"/><text class="sh mid" x="1361" y="271">PgDn</text><text class="mn mid" x="1361" y="297">3</text></g>
