<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 450" width="1510" height="450" role="img" aria-label="Keyboard test layout, 104-key ANSI">
  <title>Keyboard Input Test — 104-key ANSI layout</title>
  <desc>Every key group carries data-code matching JavaScript KeyboardEvent.code. Keys highlight on keydown/keyup.</desc>

  <defs>
    <linearGradient id="caseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f27"/><stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505c"/><stop offset="1" stop-color="#282c35"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    text  { font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; fill:#e9edf5; pointer-events:none; user-select:none; }
    .key  { cursor:pointer; transition:transform .06s ease; }
    .cap  { fill:url(#capG); stroke:#0a0c10; stroke-width:1.25; transition:fill .07s ease, stroke .07s ease; }
    .mn   { font-size:21px; font-weight:600; }
    .sh   { font-size:12px; font-weight:600; fill:#8f9bb0; }
    .mid  { text-anchor:middle; }
    .fn   { font-size:12.5px; font-weight:600; fill:#aeb7c6; text-anchor:middle; }
    .bump { fill:none; stroke:#7d8798; stroke-width:2.5; stroke-linecap:round; pointer-events:none; }
    .key:hover .cap { fill:#3d4450; }
    /* lock LEDs (kept lit while Caps/Num/Scroll lock is ON) */
    .key.lock .cap  { fill:#7a5a17; stroke:#e0b34c; filter:drop-shadow(0 0 6px rgba(224,179,76,.8)); }
    .key.lock text  { fill:#ffe9ad; }
    /* pressed / held — change the accent color here */
    .key.on         { transform:translateY(1.5px); }
    .key.on .cap    { fill:#2f6fe4; stroke:#aac9ff; filter:drop-shadow(0 0 6px rgba(84,136,255,.9)); }
    .key.on text    { fill:#ffffff; }
    .key.on .bump   { stroke:#ffffff; }
  ]]></style>

  <!-- case + plate -->
  <rect x="0" y="0" width="1510" height="450" rx="26" fill="url(#caseG)" stroke="#04060a" stroke-width="2.5"/>
  <rect x="16" y="16" width="1478" height="400" rx="14" fill="#141821" stroke="#222834" stroke-width="1.5"/>

  <g transform="translate(28,28)">

    <!-- ══ ROW 0 : function row ══ -->
    <g class="key" data-code="Escape"><rect class="cap" x="0" y="0" width="58" height="58" rx="7"/><text class="fn" x="29" y="33">Esc</text></g>
    <g class="key" data-code="F1"><rect class="cap" x="96" y="0" width="58" height="58" rx="7"/><text class="fn" x="125" y="33">F1</text></g>
    <g class="key" data-code="F2"><rect class="cap" x="160" y="0" width="58" height="58" rx="7"/><text class="fn" x="189" y="33">F2</text></g>
    <g class="key" data-code="F3"><rect class="cap" x="224" y="0" width="58" height="58" rx="7"/><text class="fn" x="253" y="33">F3</text></g>
    <g class="key" data-code="F4"><rect class="cap" x="288" y="0" width="58" height="58" rx="7"/><text class="fn" x="317" y="33">F4</text></g>
    <g class="key" data-code="F5"><rect class="cap" x="384" y="0" width="58" height="58" rx="7"/><text class="fn" x="413" y="33">F5</text></g>
    <g class="key" data-code="F6"><rect class="cap" x="448" y="0" width="58" height="58" rx="7"/><text class="fn" x="477" y="33">F6</text></g>
    <g class="key" data-code="F7"><rect class="cap" x="512" y="0" width="58" height="58" rx="7"/><text class="fn" x="541" y="33">F7</text></g>
    <g class="key" data-code="F8"><rect class="cap" x="576" y="0" width="58" height="58" rx="7"/><text class="fn" x="605" y="33">F8</text></g>
    <g class="key" data-code="F9"><rect class="cap" x="672" y="0" width="58" height="58" rx="7"/><text class="fn" x="701" y="33">F9</text></g>
    <g class="key" data-code="F10"><rect class="cap" x="736" y="0" width="58" height="58" rx="7"/><text class="fn" x="765" y="33">F10</text></g>
    <g class="key" data-code="F11"><rect class="cap" x="800" y="0" width="58" height="58" rx="7"/><text class="fn" x="829" y="33">F11</text></g>
    <g class="key" data-code="F12"><rect class="cap" x="864" y="0" width="58" height="58" rx="7"/><text class="fn" x="893" y="33">F12</text></g>
    <g class="key" data-code="PrintScreen"><rect class="cap" x="986" y="0" width="58" height="58" rx="7"/><text class="fn" x="1015" y="33">PrtSc</text></g>
    <g class="key" data-code="ScrollLock"><rect class="cap" x="1050" y="0" width="58" height="58" rx="7"/><text class="fn" x="1079" y="33">ScrLk</text></g>
    <g class="key" data-code="Pause"><rect class="cap" x="1114" y="0" width="58" height="58" rx="7"/><text class="fn" x="1143" y="33">Pause</text></g>

    <!-- ══ ROW 1 : numbers ══ -->
    <g class="key" data-code="Backquote"><rect class="cap" x="0" y="64" width="58" height="58" rx="7"/><text class="sh" x="11" y="82">~</text><text class="mn" x="11" y="109">`</text></g>
    <g class="key" data-code="Digit1"><rect class="cap" x="64" y="64" width="58" height="58" rx="7"/><text class="sh" x="75" y="82">!</text><text class="mn" x="75" y="109">1</text></g>
    <g class="key" data-code="Digit2"><rect class="cap" x="128" y="64" width="58" height="58" rx="7"/><text class="sh" x="139" y="82">@</text><text class="mn" x="139" y="109">2</text></g>
    <g class="key" data-code="Digit3"><rect class="cap" x="192" y="64" width="58" height="58" rx="7"/><text class="sh" x="203" y="82">#</text><text class="mn" x="203" y="109">3</text></g>
    <g class="key" data-code="Digit4"><rect class="cap" x="256" y="64" width="58" height="58" rx="7"/><text class="sh" x="267" y="82">$</text><text class="mn" x="267" y="109">4</text></g>
    <g class="key" data-code="Digit5"><rect class="cap" x="320" y="64" width="58" height="58" rx="7"/><text class="sh" x="331" y="82">%</text><text class="mn" x="331" y="109">5</text></g>
    <g class="key" data-code="Digit6"><rect class="cap" x="384" y="64" width="58" height="58" rx="7"/><text class="sh" x="395" y="82">^</text><text class="mn" x="395" y="109">6</text></g>
    <g class="key" data-code="Digit7"><rect class="cap" x="448" y="64" width="58" height="58" rx="7"/><text class="sh" x="459" y="82">&amp;</text><text class="mn" x="459" y="109">7</text></g>
    <g class="key" data-code="Digit8"><rect class="cap" x="512" y="64" width="58" height="58" rx="7"/><text class="sh" x="523" y="82">*</text><text class="mn" x="523" y="109">8</text></g>
    <g class="key" data-code="Digit9"><rect class="cap" x="576" y="64" width="58" height="58" rx="7"/><text class="sh" x="587" y="82">(</text><text class="mn" x="587" y="109">9</text></g>
    <g class="key" data-code="Digit0"><rect class="cap" x="640" y="64" width="58" height="58" rx="7"/><text class="sh" x="651" y="82">)</text><text class="mn" x="651" y="109">0</text></g>
    <g class="key" data-code="Minus"><rect class="cap" x="704" y="64" width="58" height="58" rx="7"/><text class="sh" x="715" y="82">_</text><text class="mn" x="715" y="109">-</text></g>
    <g class="key" data-code="Equal"><rect class="cap" x="768" y="64" width="58" height="58" rx="7"/><text class="sh" x="779" y="82">+</text><text class="mn" x="779" y="109">=</text></g>
    <g class="key" data-code="Backspace"><rect class="cap" x="832" y="64" width="122" height="58" rx="7"/><text class="fn" x="893" y="97">Backspace</text></g>
    <g class="key" data-code="Insert"><rect class="cap" x="986" y="64" width="58" height="58" rx="7"/><text class="fn" x="1015" y="97">Insert</text></g>
    <g class="key" data-code="Home"><rect class="cap" x="1050" y="64" width="58" height="58" rx="7"/><text class="fn" x="1079" y="97">Home</text></g>
