    <g class="key" data-code="NumpadMultiply"><rect class="cap" x="1332" y="64" width="58" height="58" rx="7"/><text class="mn mid" x="1361" y="100">*</text></g>
    <g class="key" data-code="NumpadSubtract"><rect class="cap" x="1396" y="64" width="58" height="58" rx="7"/><text class="mn mid" x="1425" y="100">-</text></g>

