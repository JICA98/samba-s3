    <g class="key" data-code="ArrowLeft"><rect class="cap" x="986" y="320" width="58" height="58" rx="7"/><text class="fn" x="1015" y="353">←</text></g>
    <g class="key" data-code="ArrowDown"><rect class="cap" x="1050" y="320" width="58" height="58" rx="7"/><text class="fn" x="1079" y="353">↓</text></g>
    <g class="key" data-code="ArrowRight"><rect class="cap" x="1114" y="320" width="58" height="58" rx="7"/><text class="fn" x="1143" y="353">→</text></g>
    <g class="key" data-code="Numpad0"><rect class="cap" x="1204" y="320" width="122" height="58" rx="7"/><text class="sh mid" x="1265" y="335">Ins</text><text class="mn mid" x="1265" y="361">0</text></g>
