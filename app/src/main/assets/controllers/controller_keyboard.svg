    <g class="key" data-code="BracketRight"><rect class="cap" x="800" y="128" width="58" height="58" rx="7"/><text class="sh" x="811" y="146">}</text><text class="mn" x="811" y="173">]</text></g>
    <g class="key" data-code="Backslash"><rect class="cap" x="864" y="128" width="90" height="58" rx="7"/><text class="sh" x="875" y="146">|</text><text class="mn" x="875" y="173">\</text></g>
    <g class="key" data-code="Delete"><rect class="cap" x="986" y="128" width="58" height="58" rx="7"/><text class="fn" x="1015" y="161">Delete</text></g>
